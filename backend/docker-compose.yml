services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: firemaxxer
      POSTGRES_USER: firemaxxer
      POSTGRES_PASSWORD: firemaxxerdev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firemaxxer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
